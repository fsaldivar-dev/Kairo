[package]
name = "tauri-plugin-kairo"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-kairo"
description = "Optional local document storage for the Kairo diagram editor"
license = "BSD-3-Clause"
repository = "https://github.com/fsaldivar-dev/Kairo"
readme = "README.md"
include = ["src/**", "permissions/**", "build.rs", "README.md", "LICENSE"]

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"
tempfile = "3"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
